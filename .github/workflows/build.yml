name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Diagnose compose-ui dependency resolution
        run: |
          gradle :app:dependencies --configuration debugCompileClasspath > deps.txt || true
          echo "----- compose.ui:ui matches -----"
          grep -n "compose.ui:ui" deps.txt || true
          echo "----- dependencyInsight for androidx.compose.ui:ui -----"
          gradle :app:dependencyInsight --dependency androidx.compose.ui:ui --configuration debugCompileClasspath || true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Inspect ui-android AAR contents
        if: always()
        run: |
          set -x
          AAR=$(find "$HOME/.gradle/caches" -path "*compose.ui/ui-android/1.6.8*" -name "*.aar" | head -1)
          echo "Found AAR: $AAR"
          if [ -z "$AAR" ]; then
            echo "No ui-android AAR found in cache!"
            find "$HOME/.gradle/caches" -path "*compose.ui*ui-android*" 2>/dev/null
            exit 0
          fi
          ls -la "$AAR"
          mkdir -p /tmp/aarcheck && cd /tmp/aarcheck
          unzip -o "$AAR" classes.jar
          echo "----- classes.jar size -----"
          ls -la classes.jar
          echo "----- searching for graphicsLayer-related classes -----"
          unzip -l classes.jar | grep -i graphicslayer || echo "NONE FOUND"
          echo "----- listing androidx/compose/ui/draw/ contents -----"
          unzip -l classes.jar | grep "androidx/compose/ui/draw/" || echo "NONE FOUND"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pushup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
